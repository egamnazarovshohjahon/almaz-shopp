<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALMAZ SHOP</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0b0b0b;color:white}.header{text-align:center;padding:30px 15px;background:linear-gradient(135deg,#111,#292929)}.header h1{margin:0;color:#ffb300;font-size:32px}.header p{color:#ccc}.container{max-width:520px;margin:20px auto;padding:15px}.card{background:#191919;padding:20px;border-radius:15px;box-shadow:0 5px 25px rgba(0,0,0,.5)}h2{text-align:center}label{display:block;margin-top:15px;margin-bottom:7px;color:#ddd}input,select{width:100%;padding:14px;border-radius:10px;border:1px solid #444;background:#101010;color:white;font-size:16px}.price{margin-top:15px;padding:15px;background:#292929;color:#ffb300;text-align:center;border-radius:10px;font-size:20px;font-weight:bold}button{width:100%;margin-top:15px;padding:15px;border:none;border-radius:10px;background:#ffb300;color:#111;font-size:17px;font-weight:bold;cursor:pointer}.payment{display:none;margin-top:20px;padding:15px;background:#242424;border-radius:10px}.dc{margin-top:15px;padding:15px;text-align:center;border:1px solid #ffb300;border-radius:10px}.dc-number{display:block;margin-top:8px;color:#ffb300;font-size:21px;font-weight:bold}.copy-button{background:#333;color:white;border:1px solid #ffb300}.copy-message{display:none;color:#4CAF50;margin-top:10px;font-weight:bold}.receipt{display:none}.telegram{display:block;margin-top:15px;padding:14px;background:#229ED9;color:white;text-align:center;text-decoration:none;border-radius:10px;font-weight:bold}.footer{text-align:center;padding:25px;color:#666}
</style>
</head>
<body>
<div class="header"><h1>🦅 SHOHJAHON</h1><p>💎 ALMAZ SHOP — FREE FIRE DONATE</p></div>
<div class="container"><div class="card">
<h2>💎 Фармоиши донат</h2>
<label>🎮 Free Fire ID</label>
<input id="playerId" type="text" inputmode="numeric" placeholder="ID-и Free Fire-ро ворид кунед">
<label>💎 Интихоби маҳсулот</label>
<select id="product" onchange="updatePrice()">
<option value="11">105 💎 — 11 сомонӣ</option><option value="33">326 💎 — 33 сомонӣ</option><option value="55">546 💎 — 55 сомонӣ</option><option value="110">1113 💎 — 110 сомонӣ</option><option value="205">2398 💎 — 205 сомонӣ</option><option value="510">6160 💎 — 510 сомонӣ</option><option value="7">Ваучер неделя Lite — 7 сомонӣ</option><option value="18">Ваучер на неделю — 18 сомонӣ</option><option value="105">Ваучер на месяц — 105 сомонӣ</option><option value="60">Пропуск прокачки — 60 сомонӣ</option><option value="55">Booyah Пропуск — 55 сомонӣ</option>
</select>
<div class="price" id="price">💰 Нарх: 11 сомонӣ</div>
<button onclick="showPayment()">🛒 Фармоиш додан</button>
<div class="payment" id="payment">
<h3>✅ Фармоиш омода шуд!</h3><p id="orderInfo"></p>
<div class="dc">💳 Рақами пардохти DC:<span class="dc-number" id="dcNumber">+992907970277</span><button class="copy-button" onclick="copyDC()">📋 Нусха гирифтан</button><div class="copy-message" id="copyMessage">✅ Рақам нусха гирифта шуд!</div></div>
<p>💰 Маблағи нишон додашударо ба рақами DC пардохт кунед.</p>
<button onclick="paid()">✅ Ман пардохт кардам</button>
<div class="receipt" id="receipt"><p>📸 Чекро ба Telegram фиристед:</p><a id="telegramLink" class="telegram" href="#" target="_blank">📸 Чекро равон кунед</a></div>
</div></div></div>
<div class="footer">© 2026 ALMAZ SHOP</div>
<script>
function updatePrice(){var p=document.getElementById('product');document.getElementById('price').innerHTML='💰 Нарх: '+p.value+' сомонӣ';}
function showPayment(){var id=document.getElementById('playerId').value.trim();if(id===''){alert('⚠️ Аввал Free Fire ID-ро навис!');return;}var p=document.getElementById('product'),name=p.options[p.selectedIndex].text,price=p.value;document.getElementById('orderInfo').innerHTML='🎮 Free Fire ID: <b>'+id+'</b><br>💎 Маҳсулот: <b>'+name+'</b><br>💰 Нарх: <b>'+price+' сомонӣ</b>';document.getElementById('payment').style.display='block';}
function copyDC(){var n=document.getElementById('dcNumber').innerText.trim();if(navigator.clipboard){navigator.clipboard.writeText(n).then(function(){var m=document.getElementById('copyMessage');m.style.display='block';setTimeout(function(){m.style.display='none';},2000);}).catch(function(){alert('📋 Рақами DC: '+n);});}else{alert('📋 Рақами DC: '+n);}}
function paid(){var id=document.getElementById('playerId').value.trim(),p=document.getElementById('product'),name=p.options[p.selectedIndex].text,price=p.value;var message='Салом! Ман фармоиши Almaz Shop-ро пардохт кардам.\n\n🎮 Free Fire ID: '+id+'\n💎 Маҳсулот: '+name+'\n💰 Нарх: '+price+' сомонӣ\n\n📸 Ҳоло чекро мефиристам.';document.getElementById('telegramLink').href='https://t.me/shohdanaterr?text='+encodeURIComponent(message);document.getElementById('receipt').style.display='block';}
</script>
</body>
</html>
